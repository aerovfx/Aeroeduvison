apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: demo
  labels:
    cloud.googleapis.com/location: asia-southeast1
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/execution-environment: gen2
    run.googleapis.com/description: "AeroEduVision DEMO — minimal resources for testing"
spec:
  template:
    metadata:
      annotations:
        # ---- Scaling ----
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"

        # ---- Performance ----
        # CPU throttled = CPU allocated only during request processing
        # This is the cheapest option for demo/testing
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "false"
        run.googleapis.com/execution-environment: gen2

    spec:
      containerConcurrency: 10
      timeoutSeconds: 300
      containers:
        - image: asia-southeast1-docker.pkg.dev/extreme-lattice-491123-p2/aeroedu/demo:latest
          ports:
            - containerPort: 3000

          # ---- Environment Variables ----
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: SKIP_ENV_VALIDATION
              value: "1"

            # --- Secrets (set via gcloud or Cloud Run Console) ---
            # DATABASE_URL         → Neon PostgreSQL connection string
            # NEXTAUTH_SECRET      → 64-char hex signing key
            # NEXTAUTH_URL         → Auto-set by deploy-demo.sh Step 7
            # GOOGLE_CLIENT_ID     → OAuth Client ID
            # GOOGLE_CLIENT_SECRET → OAuth Client Secret
            # OPENAI_API_KEY       → LLM API key
            # OPENAI_BASE_URL      → LLM endpoint (https://api.openai.com/v1)
            # OPENAI_DEFAULT_MODEL → Model name (gpt-4o-mini)

          # ---- Resources — Minimal for DEMO ----
          resources:
            limits:
              cpu: "1"
              memory: "2Gi"
            requests:
              cpu: "0.08"
              memory: "1Gi"

          # ---- Health Checks ----
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
