# Kubernetes Deployment Manifests for AeroeduVision
# 
# Prerequisites:
# - Kubernetes cluster (GKE, EKS, AKS, or self-managed)
# - kubectl configured
# - Helm 3.x (for some dependencies)
#
# Deploy:
#   kubectl apply -f kubernetes/namespace.yaml
#   kubectl apply -f kubernetes/configmap.yaml
#   kubectl apply -f kubernetes/secrets.yaml
#   kubectl apply -f kubernetes/postgres-statefulset.yaml
#   kubectl apply -f kubernetes/redis-deployment.yaml
#   kubectl apply -f kubernetes/aero-backend-deployment.yaml
#   kubectl apply -f kubernetes/vector-sim-deployment.yaml
#   kubectl apply -f kubernetes/nextjs-deployment.yaml
#   kubectl apply -f kubernetes/ingress.yaml
#
# Monitor:
#   kubectl get pods -n aeroedu
#   kubectl get services -n aeroedu
#   kubectl get ingress -n aeroedu

---
# =============================================================================
# Namespace
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: aeroedu
  labels:
    name: aeroedu
    environment: production

---
# =============================================================================
# ConfigMap
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: aeroedu-config
  namespace: aeroedu
data:
  # Application Configuration
  RUST_LOG: "info"
  NODE_ENV: "production"
  
  # Database
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "aeroedu"
  
  # Redis
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  
  # Service URLs
  OCR_GRADING_BACKEND_URL: "http://ocr-service:8012"
  OCR_SERVER_URL: "http://ocr-service:8001"
  
  # OpenTelemetry
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  
  # Next.js
  NEXT_PUBLIC_API_URL: "https://api.your-domain.com"

---
# =============================================================================
# Secrets (Create with actual values before deploying)
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: aeroedu-secrets
  namespace: aeroedu
type: Opaque
stringData:
  # Database credentials (CHANGE THESE!)
  DB_USER: "aero_user"
  DB_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  
  # Redis password
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  
  # JWT & Auth
  JWT_SECRET: "CHANGE_ME_USE_RANDOM_64_CHAR_STRING"
  NEXTAUTH_SECRET: "CHANGE_ME_USE_RANDOM_64_CHAR_STRING"
  
  # API Keys
  OPENAI_API_KEY: "sk-your-key-here"
  GOOGLE_AI_API_KEY: "your-gemini-key-here"

---
# =============================================================================
# PostgreSQL StatefulSet
# =============================================================================

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: aeroedu
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: aeroedu-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aeroedu-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: aeroedu-config
                  key: DB_NAME
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - $(POSTGRES_USER)
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
        storageClassName: standard

---
# =============================================================================
# PostgreSQL Service
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: aeroedu
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: postgres
  clusterIP: None  # Headless service for StatefulSet

---
# =============================================================================
# Redis Deployment
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: aeroedu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
          ports:
            - containerPort: 6372
              name: redis
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aeroedu-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5

---
# =============================================================================
# Redis Service
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: aeroedu
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: redis
  clusterIP: None

---
# =============================================================================
# Aero Backend (Rust) Deployment
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: aero-backend
  namespace: aeroedu
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aero-backend
  template:
    metadata:
      labels:
        app: aero-backend
    spec:
      containers:
        - name: aero-backend
          image: your-registry/aero-backend:latest
          ports:
            - containerPort: 8090
              name: http
          env:
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-service:5432/$(DB_NAME)"
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis-service:6379"
          envFrom:
            - configMapRef:
                name: aeroedu-config
            - secretRef:
                name: aeroedu-secrets
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 5

---
# =============================================================================
# Aero Backend Service
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: aero-backend-service
  namespace: aeroedu
spec:
  selector:
    app: aero-backend
  ports:
    - port: 8090
      targetPort: 8090
  type: ClusterIP

---
# =============================================================================
# Vector Sim Service Deployment
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-sim-service
  namespace: aeroedu
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vector-sim
  template:
    metadata:
      labels:
        app: vector-sim
    spec:
      containers:
        - name: vector-sim
          image: your-registry/vector-sim-service:latest
          ports:
            - containerPort: 8091
              name: http
            - containerPort: 50051
              name: grpc
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8091
            initialDelaySeconds: 10
            periodSeconds: 10

---
# =============================================================================
# Vector Sim Service Service
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: vector-sim-service
  namespace: aeroedu
spec:
  selector:
    app: vector-sim
  ports:
    - name: http
      port: 8091
      targetPort: 8091
    - name: grpc
      port: 50051
      targetPort: 50051
  type: ClusterIP

---
# =============================================================================
# Next.js Application Deployment
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs-app
  namespace: aeroedu
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nextjs
  template:
    metadata:
      labels:
        app: nextjs
    spec:
      containers:
        - name: nextjs
          image: your-registry/aero-nextjs:latest
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres-service:5432/$(DB_NAME)"
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis-service:6379"
          envFrom:
            - configMapRef:
                name: aeroedu-config
            - secretRef:
                name: aeroedu-secrets
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

---
# =============================================================================
# Next.js Application Service
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: nextjs-service
  namespace: aeroedu
spec:
  selector:
    app: nextjs
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP

---
# =============================================================================
# Ingress (Nginx Ingress Controller required)
# =============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aeroedu-ingress
  namespace: aeroedu
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - your-domain.com
        - api.your-domain.com
      secretName: aeroedu-tls
  rules:
    - host: your-domain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nextjs-service
                port:
                  number: 3000
    - host: api.your-domain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aero-backend-service
                port:
                  number: 8090
