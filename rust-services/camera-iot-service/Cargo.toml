[package]
name = "camera-iot-service"
version = "0.1.0"
edition = "2021"
description = "Camera & IoT gateway service for Aeroeduvison - RTSP stream management, device telemetry, classroom monitoring"

[dependencies]
# Web framework (with WebSocket for IoT real-time)
axum = { version = "0.7", features = ["macros", "ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "time", "signal"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }

# JWT (auth validation)
jsonwebtoken = "9"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
thiserror = "2"

# HTTP client (for auth-service, external APIs)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
dotenvy = "0.15"

# MQTT client (IoT device communication - Arduino, Raspberry Pi)
rumqttc = "0.24"

# Serial port (direct USB connection to Arduino/ESP)
# tokio-serial = "5.4"

# Random for device token generation
rand = "0.8"
