[package]
name = "camera-iot-service"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Camera & IoT gateway service for Aeroeduvison - RTSP stream management, device telemetry, classroom monitoring"

[dependencies]
# Web framework (with WebSocket for IoT real-time)
axum = { workspace = true, features = ["macros", "ws"] }
tower = "0.4"
tower-http = { workspace = true, features = ["cors", "trace"] }

# Async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "process", "time", "signal"] }
futures-util = "0.3"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Database
sqlx = { workspace = true }

# JWT (auth validation)
jsonwebtoken = "9"

# Utilities
uuid = { workspace = true, features = ["serde"] }
chrono = { workspace = true }
once_cell = "1"
thiserror = "2"

# HTTP client (for auth-service, external APIs)
reqwest = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Configuration
dotenvy = "0.15"

# MQTT client (IoT device communication - Arduino, Raspberry Pi)
rumqttc = "0.24"

# Random for device token generation
rand = "0.8"
