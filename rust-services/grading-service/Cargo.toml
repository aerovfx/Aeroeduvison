[package]
name = "grading-service"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AI-powered grading microservice for Aeroeduvison - essay grading, batch processing, human review workflows"

[dependencies]
# Web framework
axum = { workspace = true, features = ["macros"] }
tower = "0.4"
tower-http = { workspace = true, features = ["cors", "trace"] }

# Async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Database
sqlx = { workspace = true, features = ["json"] }

# Redis
redis = { workspace = true }

# JWT (NextAuth session validation)
jsonwebtoken = "9"

# HTTP client (LLM provider calls)
reqwest = { workspace = true }

# Utilities
uuid = { workspace = true, features = ["serde"] }
chrono = { workspace = true }
once_cell = "1"
thiserror = "2"
regex = "1"

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Configuration
dotenvy = "0.15"
