version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aeroedu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  chat-service:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/aeroedu
      CHAT_SERVICE_ADDR: 0.0.0.0:8096
      JWT_SECRET: dev-secret-key-change-in-production
      RUST_LOG: debug
    ports:
      - "8096:8096"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./:/app
      - /app/target

volumes:
  postgres_data:
