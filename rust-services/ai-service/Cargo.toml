[package]
name = "ai-service"
version = "0.1.0"
edition = "2021"
description = "AI service for Aeroeduvison - chat, content generation, document analysis"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "bigdecimal"] }

# JWT (for auth validation)
jsonwebtoken = "9"

# HTTP client for LLM APIs
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Streaming
tokio-stream = "0.1"
async-stream = "0.3"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
dotenvy = "0.15"

# OpenFang integration
openfang-kernel = { path = "../../openfang-core/openfang-kernel" }
openfang-types = { path = "../../openfang-core/openfang-types" }
openfang-runtime = { path = "../../openfang-core/openfang-runtime" }

