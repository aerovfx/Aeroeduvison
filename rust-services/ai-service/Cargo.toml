[package]
name = "ai-service"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AI service for Aeroeduvison - chat, content generation, document analysis"

[dependencies]
# Web framework
axum = { workspace = true, features = ["macros"] }
tower = "0.4"
tower-http = { workspace = true, features = ["cors", "trace"] }

# Async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Database
sqlx = { workspace = true, features = ["bigdecimal", "macros"] }

# JWT (for auth validation)
jsonwebtoken = "9"

# HTTP client for LLM APIs
reqwest = { workspace = true }

# Streaming
tokio-stream = "0.1"
async-stream = "0.3"

# Utilities
uuid = { workspace = true, features = ["serde"] }
chrono = { workspace = true }
once_cell = "1"
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Configuration
dotenvy = "0.15"

# OpenFang integration (workspace members)
openfang-kernel = { path = "../../openfang-core/openfang-kernel" }
openfang-types = { path = "../../openfang-core/openfang-types" }
openfang-runtime = { path = "../../openfang-core/openfang-runtime" }
