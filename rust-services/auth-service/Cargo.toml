[package]
name = "auth-service"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Authentication service for Aeroeduvison - handles login, register, 2FA, JWT"

[dependencies]
# Web framework
axum = { workspace = true, features = ["macros"] }
tower = "0.4"
tower-http = { workspace = true, features = ["cors", "trace"] }

# Async runtime
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Database
# TLS required when DATABASE_URL has sslmode=require (e.g. cloud Postgres)
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "bigdecimal"] }

# Password hashing
argon2 = "0.5"
bcrypt = "0.15"

# JWT
jsonwebtoken = "9"

# TOTP for 2FA
totp-rs = { version = "5", features = ["gen_secret"] }

# Utilities
uuid = { workspace = true, features = ["serde"] }
chrono = { workspace = true }
once_cell = "1"
thiserror = "2"
rand = "0.8"

# HTTP client
reqwest = { workspace = true }

# Email sending (lettre)
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport"] }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Configuration
dotenvy = "0.15"
