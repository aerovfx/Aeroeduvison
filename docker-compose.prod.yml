version: '3.8'

# Production Docker Compose for AeroeduVision
# Includes: Next.js app, Rust services, PostgreSQL, Redis, Prometheus, Grafana, Nginx

services:
  # ============================================================================
  # Database Layer
  # ============================================================================
  
  postgres:
    image: postgres:15-alpine
    container_name: aero-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-aero_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${DB_NAME:-aeroedu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aero_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aero-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aero-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-change_me}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aero-network
    restart: unless-stopped

  # ============================================================================
  # Rust Microservices
  # ============================================================================
  
  aero-backend:
    build:
      context: .
      dockerfile: Dockerfile.aero-backend
    container_name: aero-backend
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://${DB_USER:-aero_user}:${DB_PASSWORD:-change_me_in_production}@postgres:5432/${DB_NAME:-aeroedu}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-change_me}@redis:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OCR_GRADING_BACKEND_URL=http://ocr-service:8012
      - OCR_SERVER_URL=http://ocr-service:8001
      - JWT_SECRET=${JWT_SECRET:-change_me_in_production}
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aero-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  vector-sim-service:
    build:
      context: .
      dockerfile: Dockerfile.vector-sim
    container_name: vector-sim-service
    environment:
      - RUST_LOG=info
      - VECTOR_SIM_SERVICE_ADDR=0.0.0.0:8091
      - GRPC_ADDR=0.0.0.0:50051
    ports:
      - "8091:8091"
      - "50051:50051"
    networks:
      - aero-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8091/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # Next.js Application
  # ============================================================================
  
  nextjs-app:
    build:
      context: .
      dockerfile: Dockerfile.nextjs
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    container_name: aero-nextjs
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-aero_user}:${DB_PASSWORD:-change_me_in_production}@postgres:5432/${DB_NAME:-aeroedu}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-change_me}@redis:6379
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change_me_in_production}
      - RUST_BACKEND_URL=http://aero-backend:8090
      - RUST_VECTOR_SERVICE_URL=http://vector-sim-service:8091
    ports:
      - "3000:3000"
    depends_on:
      - aero-backend
      - postgres
      - redis
    networks:
      - aero-network
    restart: unless-stopped

  # ============================================================================
  # Monitoring & Observability
  # ============================================================================
  
  otel-collector:
    image: otel/opentelemetry-collector:0.88.0
    container_name: otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./monitoring/otel-collector-config.yaml:/etc/otel/config.yaml
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
      - "8889:8889"  # Prometheus metrics
    depends_on:
      - prometheus
    networks:
      - aero-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: aero-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - aero-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.1.0
    container_name: aero-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3001:3001"
    depends_on:
      - prometheus
    networks:
      - aero-network
    restart: unless-stopped

  # ============================================================================
  # API Gateway (Nginx)
  # ============================================================================
  
  nginx:
    image: nginx:alpine
    container_name: aero-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - nextjs-app
      - aero-backend
    networks:
      - aero-network
    restart: unless-stopped

  # ============================================================================
  # Backup Service
  # ============================================================================
  
  backup:
    image: postgres:15-alpine
    container_name: aero-backup
    environment:
      - PGPASSWORD=${DB_PASSWORD:-change_me_in_production}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh
    entrypoint: ["/bin/sh", "-c"]
    command: ["chmod +x /backup.sh && /backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aero-network
    restart: "no"

# ==============================================================================
# Networks
# ==============================================================================

networks:
  aero-network:
    driver: bridge

# ==============================================================================
# Volumes
# ==============================================================================

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
