name: Deploy On-Premise Runner

on:
  workflow_dispatch:
    inputs:
      image:
        description: Fully-qualified image@sha256:digest
        required: true
      source_sha:
        description: Approved 40-character release commit SHA
        required: true

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, onprem]
    environment: onprem-production
    concurrency:
      group: deploy-onprem-production
      cancel-in-progress: false
    steps:
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_READ_TOKEN }}
      - name: Verify and deploy digest
        env:
          AEROEDU_IMAGE: ${{ inputs.image }}
          COSIGN_PUBLIC_KEY_CONTENT: ${{ secrets.COSIGN_PUBLIC_KEY }}
          COSIGN_PUBLIC_KEY_SHA256: ${{ vars.COSIGN_PUBLIC_KEY_SHA256 }}
          GOVERNANCE_PUBLIC_KEY_CONTENT: ${{ vars.GOVERNANCE_PUBLIC_KEY_B64 }}
          GOVERNANCE_PUBLIC_KEY_SHA256: ${{ vars.GOVERNANCE_PUBLIC_KEY_SHA256 }}
          DR_APPROVAL_RUN_ID: ${{ vars.LAST_DR_APPROVAL_RUN_ID }}
          APPROVED_RELEASE_POLICY_SHA256: ${{ vars.APPROVED_RELEASE_POLICY_SHA256 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LICENSE_PUBLIC_KEY_CONTENT: ${{ secrets.LICENSE_PUBLIC_KEY }}
          LICENSE_FILE_HOST: ${{ secrets.LICENSE_FILE_HOST }}
          INSTALLATION_ID: ${{ vars.INSTALLATION_ID }}
          EXPECTED_SOURCE_REPOSITORY: ${{ vars.EXPECTED_SOURCE_REPOSITORY }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          LICENSE_ISSUER: ${{ vars.LICENSE_ISSUER || 'aeroedu' }}
          LICENSE_KEY_ID: ${{ vars.LICENSE_KEY_ID || 'primary-2026' }}
          AEROEDU_ENV_FILE: ${{ vars.AEROEDU_ENV_FILE }}
          AEROEDU_HOME: ${{ vars.AEROEDU_HOME }}
        run: |
          umask 077
          keydir="$(mktemp -d)"
          trap 'rm -rf "$keydir"' EXIT
          printf '%s' "$COSIGN_PUBLIC_KEY_CONTENT" > "$keydir/cosign.pub"
          printf '%s' "$LICENSE_PUBLIC_KEY_CONTENT" > "$keydir/license-public.pem"
          printf '%s' "$GOVERNANCE_PUBLIC_KEY_CONTENT" | base64 -d > "$keydir/governance.pub"
          [[ "$DR_APPROVAL_RUN_ID" =~ ^[0-9]+$ ]]
          gh run download "$DR_APPROVAL_RUN_ID" -n "dr-governance-$DR_APPROVAL_RUN_ID" -D "$keydir/dr"
          COSIGN_PUBLIC_KEY="$keydir/cosign.pub" GOVERNANCE_PUBLIC_KEY="$keydir/governance.pub" DR_APPROVAL_FILE="$keydir/dr/dr-approval.json" DR_APPROVAL_BUNDLE="$keydir/dr/dr-approval.bundle" LICENSE_PUBLIC_KEY_FILE="$keydir/license-public.pem" bash "${AEROEDU_HOME:-/opt/aeroedu}/scripts/deploy-verified.sh"
