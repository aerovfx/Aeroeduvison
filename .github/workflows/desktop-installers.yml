name: Desktop Installers

on:
  workflow_dispatch:

jobs:
  build-macos-dmg:
    name: Build macOS DMG (arm64)
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop-current-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build DMG
        run: bun run build:desktop:mac-arm64

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64-dmg
          path: desktop-current-app/release/*.dmg
          if-no-files-found: error

  build-windows-msi:
    name: Build Windows MSI (x64)
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
        working-directory: desktop-current-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build MSI
        run: bun run build:desktop:win-x64

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64-msi
          path: desktop-current-app/release/*.msi
          if-no-files-found: error
