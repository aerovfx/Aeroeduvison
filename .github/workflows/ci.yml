name: CI/CD Pipeline

on:
  push:
    branches: [siri, main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.75.0
  NODE_VERSION: 18.x

jobs:
  # Job 1: Rust Backend Tests
  rust-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:latest
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3
      
      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          working-directory: rust-services/aero-backend
      
      - name: Run Rust tests
        working-directory: rust-services/aero-backend
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
        run: |
          cargo test --verbose
      
      - name: Check Rust code formatting
        working-directory: rust-services/aero-backend
        run: cargo fmt -- --check
      
      - name: Run Rust linter
        working-directory: rust-services/aero-backend
        run: cargo clippy -- -D warnings

  # Job 2: Build Rust Backend
  rust-build:
    runs-on: ubuntu-latest
    needs: rust-test
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Rust
        uses: dtolnay/rust-action@stable
      
      - name: Build Rust backend (release)
        working-directory: rust-services/aero-backend
        run: cargo build --release
      
      - name: Upload Rust binary
        uses: actions/upload-artifact@v3
        with:
          name: aero-backend
          path: rust-services/aero-backend/target/release/aero-backend

  # Job 3: Next.js Tests
  nextjs-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run Next.js lint
        run: npm run lint
      
      - name: Run Next.js tests
        run: npm test
      
      - name: Build Next.js app
        run: npm run build

  # Job 4: Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [rust-build, nextjs-test]
    if: github.ref == 'refs/heads/siri'
    environment: staging
    steps:
      - uses: actions/checkout@v3
      
      - name: Download Rust binary
        uses: actions/download-artifact@v3
        with:
          name: aero-backend
      
      - name: Deploy to staging server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/aeroedu/staging
            ./deploy.sh

  # Job 5: Deploy to Production
  deploy-production:
    runs-on: ubuntu-latest
    needs: [rust-build, nextjs-test]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v3
      
      - name: Download Rust binary
        uses: actions/download-artifact@v3
        with:
          name: aero-backend
      
      - name: Deploy to production server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/aeroedu/production
            ./deploy.sh
