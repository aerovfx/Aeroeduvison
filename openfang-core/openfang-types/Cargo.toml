[package]
name = "openfang-types"
version = "0.1.0"
edition = "2021"
description = "OpenFang Core Types for Aeroeduvison"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
