    <circle cx="74" cy="30" r="6" fill="#2b2d42"/><circle cx="98" cy="30" r="6" fill="#2b2d42"/>
    <ellipse cx="106" cy="48" rx="20" ry="14" fill="#cfd6e4"/><circle cx="120" cy="46" r="6" fill="#2b2d42"/>
    <path d="M96 60 Q112 70 126 58" stroke="#2b2d42" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M-100 96 Q-150 70 -150 120 Q-128 110 -100 118 Z" fill="#8d99ae"/>
