<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs><linearGradient id="s5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe6ff"/><stop offset="1" stop-color="#e9f7e2"/></linearGradient></defs>
  <rect width="800" height="600" fill="url(#s5)"/>
  <path d="M0 470 Q400 440 800 470 L800 600 L0 600 Z" fill="#7fd06f"/>
