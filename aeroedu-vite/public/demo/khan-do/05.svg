    <g stroke="#6b7689" stroke-width="14" stroke-linecap="round"><line x1="-30" y1="140" x2="-58" y2="170"/><line x1="40" y1="140" x2="66" y2="172"/></g>
  </g>
  <rect x="180" y="40" width="440" height="60" rx="16" fill="#fff" opacity=".82"/>
  <text x="400" y="80" font-family="'Comic Sans MS',sans-serif" font-size="26" font-weight="800" fill="#6b7280" text-anchor="middle">Sói chạy thật nhanh đến nhà bà trước</text>
