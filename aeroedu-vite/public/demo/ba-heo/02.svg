  </g>
  <g><rect x="150" y="36" width="500" height="56" rx="16" fill="#fff" stroke="#46342a" stroke-width="3.5"/>
     <text x="400" y="73" font-family="'Comic Sans MS',sans-serif" font-size="19" font-weight="800" fill="#e85a9a" text-anchor="middle">Heo út xây nhà rơm, heo nhỡ nhà gỗ, heo cả nhà gạch</text></g>
