server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ─────────────────────────────────────────
    # Phục vụ file đã pre-compress (.br, .gz) được Vite tạo ở build time.
    # Khi client gửi `Accept-Encoding: br` → nginx trả `*.js.br`, tiết kiệm
    # thêm ~15-20% so với brotli-on-the-fly và không tốn CPU mỗi request.
    # Require: build image của nginx có module ngx_brotli (xem Dockerfile).
    brotli_static on;
    gzip_static on;

    # Fallback compression on-the-fly cho những MIME chưa có file .br sẵn
    brotli on;
    brotli_comp_level 4;
    brotli_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/wasm
        application/x-font-ttf application/vnd.ms-fontobject
        font/opentype font/ttf font/woff font/woff2
        image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/wasm
        application/x-font-ttf application/vnd.ms-fontobject
        font/opentype font/ttf font/woff font/woff2
        image/svg+xml;

    # ── Cache: static assets (1 year, immutable) ─────────────
    # Tất cả file trong /assets/* đều có content-hash trong tên → an toàn cache forever
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Vary "Accept-Encoding";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(js|css|woff|woff2|ttf|eot|otf|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Vary "Accept-Encoding";
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ── API reverse proxy (khi deploy standalone) ─────────────
    # Uncomment nếu cần proxy API từ cùng domain
    # location /api/ {
    #     proxy_pass http://aero-backend:8090/api/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_cache_bypass $http_upgrade;
    # }

    # ── SPA fallback — React Router ───────────────────────────
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # ── Security headers ──────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Labs dùng camera/mic (hand tracking, emotion, object recognition, AR)
    # camera=(self) và microphone=(self) cho phép từ cùng origin — không mở wildcard
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    # Content Security Policy
    # blob: cần cho Three.js / WebGL workers; wss: cần cho exam room / hand tracking
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: https: blob:;
        media-src 'self' https: blob:;
        connect-src 'self' wss: https: ws:;
        frame-src 'self' https://www.youtube.com https://player.vimeo.com;
        worker-src 'self' blob:;
    " always;

    # ── Health check endpoint ─────────────────────────────────
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ── Error pages ───────────────────────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
