// ── Seed function ─────────────────────────────────────────────────────────────
window.runSeed = async function() {
  const btn = document.getElementById('btn')
  btn.disabled = true
  logEl.innerHTML = ''

  log('🔌 Kết nối Neon database...', 'info')

  let neon
  try {
    // Load @neondatabase/serverless from CDN
    const mod = await import('https://esm.sh/@neondatabase/serverless@0.10.4')
    neon = mod.neon
    log('✅ Neon serverless driver đã tải', 'ok')
  } catch(e) {
    log(`❌ Không tải được driver: ${e.message}`, 'err')
    log('👉 Hãy chạy: node scripts/seed-physics-courses.mjs', 'info')
    btn.disabled = false
    return
  }

  const sql = neon(CONNECTION_STRING)

  try {
    // Ping
    const ping = await sql`SELECT 1 as ok`
    log(`✅ Đã kết nối DB (ping OK)`, 'ok')
  } catch(e) {
    log(`❌ Kết nối thất bại: ${e.message}`, 'err')
    btn.disabled = false
    return
  }

  // Ensure Category "Vật lí"
  log('\n📁 Kiểm tra danh mục "Vật lí"...', 'info')
  let catRows = await sql`SELECT id FROM "Category" WHERE lower(name) = 'vật lí'`
  let catId
  if (catRows.length) {
    catId = catRows[0].id
    log(`   Đã tồn tại → ${catId}`, 'info')
  } else {
    catId = uid()
    await sql`INSERT INTO "Category" (id, name) VALUES (${catId}, 'Vật lí')`
    log(`   Đã tạo mới → ${catId}`, 'ok')
  }

  // Insert courses
  log('\n📚 Tạo 4 khoá học...', 'info')
  for (const c of courses) {
    const courseId = uid()
    const now = new Date().toISOString()
    try {
      await sql`
        INSERT INTO "Course"
          (id, user_id, school_id, title, description, image_url, price, category_id, is_published, created_at, updated_at)
        VALUES
          (${courseId}, ${TEACHER_ID}, ${SCHOOL_ID}, ${c.title}, ${c.description},
           ${c.image_url}, ${c.price}, ${catId}, true, ${now}, ${now})
      `
      log(`\n✅ ${c.title.substring(0,55)}`, 'ok')

      for (const ch of c.chapters) {
        const chId = uid()
        await sql`
          INSERT INTO "Chapter"
            (id, course_id, title, position, is_published, is_free, created_at, updated_at)
          VALUES
            (${chId}, ${courseId}, ${ch.title}, ${ch.pos}, true, ${ch.free ?? false}, ${now}, ${now})
        `
        log(`   └ ${ch.free ? '🆓 ' : '   '}${ch.title}`, 'info')
      }
    } catch(e) {
      log(`❌ Lỗi khoá học "${c.title.substring(0,30)}": ${e.message}`, 'err')
    }
  }

  log('\n\n🎉 HOÀN TẤT! Reload lại http://localhost:5173 để xem khoá học.', 'ok')
  btn.textContent = '✅ Đã xong!'
}
