# OpenFang Configuration for Aeroeduvison
# Run sequentially as requested by Boss Huong

[server]
host = "127.0.0.1"
port = 8080

[providers.openai]
enabled = true
api_key_env = "OPENAI_API_KEY"
models = ["gpt-4o", "gpt-4o-mini", "gpt-3.5-turbo"]
default_model = "gpt-4o"

[providers.gemini]
enabled = true
api_key_env = "GEMINI_API_KEY"
models = ["gemini-2.0-flash", "gemini-1.5-pro"]
default_model = "gemini-2.0-flash"

[memory]
enabled = true
# Use SQLite for easier setup on Windows
sqlite_path = "./data/openfang.db"

[agents.tutor]
enabled = true
provider = "openai"
model = "gpt-4o"
system_prompt = "./prompts/tutor.txt"
temperature = 0.7

[agents.researcher]
enabled = true
provider = "openai"
model = "gpt-4o"
system_prompt = "./prompts/researcher.txt"
temperature = 0.3
